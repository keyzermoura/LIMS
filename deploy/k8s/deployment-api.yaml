apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-backend
  namespace: lims
  labels:
    app.kubernetes.io/name: lims-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: lims-platform
    app.kubernetes.io/version: "1.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lims-backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lims-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: lims-platform
        app.kubernetes.io/version: "1.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/keyzermoura/lims-backend:v1.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: lims-config
            - secretRef:
                name: lims-secrets
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
