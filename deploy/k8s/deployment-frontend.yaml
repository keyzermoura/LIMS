apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-frontend
  namespace: lims
  labels:
    app.kubernetes.io/name: lims-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lims-platform
    app.kubernetes.io/version: "1.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lims-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lims-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: lims-platform
        app.kubernetes.io/version: "1.1.0"
    spec:
      containers:
        - name: frontend
          image: ghcr.io/keyzermoura/lims-frontend:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
