apiVersion: v1
kind: Secret
metadata:
  name: lims-secrets
  namespace: lims
  labels:
    app.kubernetes.io/name: lims
    app.kubernetes.io/part-of: lims-platform
type: Opaque
stringData:
  # ATENÇÃO: Substituir os valores em produção via sealed-secrets, vault ou kustomize secretGenerator
  DATABASE_URL: "postgresql+asyncpg://lims_user:CHANGE_ME_SECRET_PASSWORD@postgres-service.lims.svc.cluster.local:5432/lims_production"
  JWT_SECRET: "REPLACE_WITH_SECURE_64_BYTE_HEX_JWT_SECRET_FOR_PRODUCTION_KEY"
  QR_SIGNING_KEY: "REPLACE_WITH_SECURE_64_BYTE_HEX_QR_KEY_FOR_PRODUCTION_SIGNING"
  SEED_ADMIN_PASSWORD: "REPLACE_WITH_INITIAL_BOOTSTRAP_PASSWORD_MIN_12_CHARS"
