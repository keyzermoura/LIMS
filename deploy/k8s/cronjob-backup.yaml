apiVersion: batch/v1
kind: CronJob
metadata:
  name: lims-backup-pitr
  namespace: lims
  labels:
    app.kubernetes.io/name: lims-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: lims-platform
spec:
  # Execução diária às 02:00 UTC (scheduled backup com restauração e hash SHA-256)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lims-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup-worker
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  echo "Iniciando scheduled backup PITR diário..."
                  /scripts/backup_restore_pitr.sh
              envFrom:
                - configMapRef:
                    name: lims-config
                - secretRef:
                    name: lims-secrets
              volumeMounts:
                - name: backup-scripts
                  mountPath: /scripts
                - name: backup-storage
                  mountPath: /var/backups/lims
          volumes:
            - name: backup-scripts
              configMap:
                name: lims-backup-scripts
                defaultMode: 0755
            - name: backup-storage
              persistentVolumeClaim:
                claimName: lims-backup-pvc
