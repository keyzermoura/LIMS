openapi: 3.1.0
info:
  title: LIMS API — Recebimento e Custódia
  version: 0.1.0
  summary: Contrato documental preliminar para recebimento físico, custódia e aceite.
  description: |
    Especificação PROPOSTA para revisão técnica e funcional. Não representa rotas
    implementadas nem autoriza implementação. As decisões API01–API12 permanecem
    pendentes. Os contratos novos são candidatos e deverão ser harmonizados com
    o schema, os serviços e os padrões efetivamente aprovados.
    Fonte funcional: docs/ESPECIFICACAO_CONTRATOS_API_RECEBIMENTO_CUSTODIA.md.
  contact:
    name: Projeto LIMS
servers:
  - url: /api/v1
    description: Prefixo proposto da API v1; endereço-base de implantação não definido.
tags:
  - name: Recebimento
  - name: Custódia
  - name: Aceite
  - name: Compatibilidade legada
security:
  - bearerAuth: []
paths:
  /solicitations/{solicitation_id}/receipt:
    parameters:
      - $ref: '#/components/parameters/SolicitationId'
    post:
      tags: [Recebimento]
      operationId: createSolicitationReceipt
      summary: Registrar a chegada física e o recebimento principal.
      description: |
        NOVO CONTRATO PROPOSTO. Comando transacional para criar Receipt, todos
        os ReceiptItems e os objetos/eventos de custódia dos itens apresentados.
        Cada item declarado deve aparecer exatamente uma vez. Itens não
        apresentados não criam custódia. O formato de agrupamento/quantidade
        permanece provisório (API02/API03).
      x-specification-status: proposed-not-approved
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptCreate'
            example:
              arrived_at: '2026-11-09T08:45:00-03:00'
              arrival_location: Setor de recebimento
              external_protocol: HARPYA-123456
              notes: Entrega acompanhada de documentação.
              items:
                - solicitation_item_id: 11111111-1111-4111-8111-111111111111
                  presentation_status: PRESENTED
                  presented_quantity: 10
                  custody_objects:
                    - grouping_description: Dez unidades agrupadas para avaliação conjunta
                      represented_quantity: 10
                      initial_location: Área de recebimento
                - solicitation_item_id: 22222222-2222-4222-8222-222222222222
                  presentation_status: NOT_PRESENTED
                  presented_quantity: 0
                  custody_objects: []
      responses:
        '201':
          description: Recebimento criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Recebimento já existe ou conflito de idempotência/concorrência.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /receipts/{receipt_id}:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Recebimento]
      operationId: getReceipt
      summary: Consultar recebimento e seus itens.
      description: Novo contrato proposto. Deve distinguir declaração, apresentação, conferência, decisão e objetos de custódia.
      x-specification-status: proposed-not-approved
      responses:
        '200':
          description: Recebimento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /solicitations/{solicitation_id}/receipt:
    parameters:
      - $ref: '#/components/parameters/SolicitationId'
    get:
      tags: [Recebimento]
      operationId: getReceiptBySolicitation
      summary: Consultar o recebimento principal de uma solicitação.
      description: Não cria recebimento por efeito colateral. Retorna 404 se ainda não existir.
      x-specification-status: proposed-not-approved
      responses:
        '200':
          description: Recebimento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /custody/objects/{custody_object_id}/history:
    parameters:
      - $ref: '#/components/parameters/CustodyObjectId'
    get:
      tags: [Custódia]
      operationId: getCustodyObjectHistory
      summary: Consultar histórico unificado de custódia do objeto.
      description: |
        Novo contrato proposto. Deve retornar eventos anteriores e posteriores
        à criação da DeviceSample, sem duplicação. A enumeração final de tipos
        de evento e a semântica de timestamps/autoria aguardam API04.
      x-specification-status: proposed-not-approved
      parameters:
        - name: from
          in: query
          description: Instante inicial ISO 8601 com offset.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Instante final ISO 8601 com offset.
          schema: { type: string, format: date-time }
        - name: event_type
          in: query
          description: Filtro repetível; enum provisório ainda não fechado.
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Histórico consultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /custody/objects/{custody_object_id}/transfers:
    parameters:
      - $ref: '#/components/parameters/CustodyObjectId'
    post:
      tags: [Custódia]
      operationId: createCustodyTransfer
      summary: Registrar transferência de custódia de um objeto.
      description: |
        Novo contrato proposto. O custodiante de origem e o ator que registra
        são derivados do estado confiável e da autenticação, não do corpo.
        A assinatura e a escolha entre If-Match e expected_version permanecem
        pendentes (API05/API06). Política de data retroativa pendente (API12).
      x-specification-status: proposed-not-approved
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodyTransferCreate'
      responses:
        '201':
          description: Transferência registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyTransferCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado, versão ou idempotência.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /custody/objects/{custody_object_id}/acceptance:
    parameters:
      - $ref: '#/components/parameters/CustodyObjectId'
    post:
      tags: [Aceite]
      operationId: acceptCustodyObject
      summary: Formalizar aceite e criar amostra operacional.
      description: |
        Novo contrato proposto. A operação deve validar novamente os critérios
        e criar no máximo uma DeviceSample em transação atômica. received_at e
        received_by_id devem preservar os dados da chegada física. O payload
        mínimo da amostra e a política de assinatura permanecem pendentes
        (API05/API08); resposta para objeto já aceito depende de API09.
      x-specification-status: proposed-not-approved
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceCreate'
      responses:
        '201':
          description: Aceite e criação da amostra concluídos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Objeto inelegível, versão conflitante, amostra já criada ou idempotência incompatível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Bloqueio de aceite, validação de coordenação ou assinatura obrigatória ausente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /samples/{sample_id}/custody:
    get:
      tags: [Compatibilidade legada]
      operationId: getSampleCustody
      summary: Consultar custódia por amostra.
      description: |
        Rota existente a preservar. Para amostras legadas sem objeto, consulta
        a referência legada; para amostras novas, resolve o CustodyObject e
        retorna os eventos do objeto sem duplicação. O schema de resposta
        precisa ser harmonizado com o contrato legado antes da implementação.
      x-specification-status: existing-route-compatibility-contract-incomplete
      parameters:
        - $ref: '#/components/parameters/SampleId'
      responses:
        '200':
          description: Histórico de custódia da amostra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyCompatibleResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /samples/{sample_id}/timeline:
    get:
      tags: [Compatibilidade legada]
      operationId: getSampleTimeline
      summary: Consultar timeline da amostra.
      description: Rota existente a preservar. A timeline de amostra nova deverá incorporar eventos do objeto sem duplicar a chegada ou usar localização corrente como localização histórica.
      x-specification-status: existing-route-compatibility-contract-incomplete
      parameters:
        - $ref: '#/components/parameters/SampleId'
      responses:
        '200':
          description: Timeline da amostra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyCompatibleResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /custody/{sample_id}/history:
    get:
      tags: [Compatibilidade legada]
      operationId: getLegacySampleCustodyHistory
      summary: Consultar histórico legado por amostra.
      description: Rota existente a preservar para amostras legadas durante a transição. O novo histórico pré-amostra é consultado pela rota de objeto.
      x-specification-status: existing-route-compatibility-contract-incomplete
      parameters:
        - $ref: '#/components/parameters/SampleId'
      responses:
        '200':
          description: Histórico legado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyCompatibleResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /custody/transfer:
    post:
      tags: [Compatibilidade legada]
      operationId: createLegacyCustodyTransfer
      summary: Transferir custódia de amostra legada.
      description: Rota existente a preservar para o fluxo legado baseado em DeviceSample. Não deve ser usada para eventos novos associados a CustodyObject.
      x-specification-status: existing-route-compatibility-contract-incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyCompatibleRequest'
      responses:
        '200':
          description: Resposta legada; status e schema exatos devem ser copiados do contrato runtime vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyCompatibleResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflito legado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SolicitationId:
      name: solicitation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustodyObjectId:
      name: custody_object_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SampleId:
      name: sample_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave opaca para repetição segura. Escopo, retenção e replay aguardam API07.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Alternativa candidata a expected_version no corpo; decisão API06 pendente.
      schema: { type: string }
  responses:
    BadRequest:
      description: Requisição malformada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Autenticação ausente ou inválida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Usuário sem autorização para a operação.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso inexistente ou não visível ao usuário.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: Dados válidos sintaticamente, mas inconsistentes com regras de domínio.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id:
              type: [string, 'null']
    ReceiptCreate:
      type: object
      additionalProperties: false
      required: [arrived_at, items]
      properties:
        arrived_at:
          type: string
          format: date-time
          description: Instante efetivo da chegada, com offset explícito.
        arrival_location: { type: [string, 'null'], maxLength: 255 }
        external_protocol: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'] }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReceiptItemCreate' }
    ReceiptItemCreate:
      type: object
      additionalProperties: false
      required: [solicitation_item_id, presentation_status, presented_quantity, custody_objects]
      properties:
        solicitation_item_id: { type: string, format: uuid }
        presentation_status:
          type: string
          enum: [PRESENTED, NOT_PRESENTED]
        presented_quantity:
          type: number
          minimum: 0
        custody_objects:
          type: array
          items: { $ref: '#/components/schemas/CustodyObjectCreate' }
    CustodyObjectCreate:
      type: object
      additionalProperties: false
      required: [represented_quantity]
      properties:
        grouping_description: { type: [string, 'null'], maxLength: 500 }
        represented_quantity: { type: number, exclusiveMinimum: 0 }
        initial_location: { type: [string, 'null'], maxLength: 255 }
        seal_number: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'] }
    ReceiptCreated:
      type: object
      required: [receipt, items]
      properties:
        receipt: { $ref: '#/components/schemas/ReceiptSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReceiptItemSummary' }
        audit_log_id: { type: [integer, 'null'] }
    ReceiptDetail:
      allOf:
        - $ref: '#/components/schemas/ReceiptCreated'
        - type: object
          properties:
            conference: { type: object, additionalProperties: true }
            decisions: { type: array, items: { type: object, additionalProperties: true } }
    ReceiptSummary:
      type: object
      required: [id, solicitation_id, arrived_at, status, created_at]
      properties:
        id: { type: string, format: uuid }
        solicitation_id: { type: string, format: uuid }
        arrived_at: { type: string, format: date-time }
        received_by:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        arrival_location: { type: [string, 'null'] }
        status: { type: string }
        created_at: { type: string, format: date-time }
    ReceiptItemSummary:
      type: object
      required: [id, solicitation_item_id, presentation_status, presented_quantity, custody_objects]
      properties:
        id: { type: string, format: uuid }
        solicitation_item_id: { type: string, format: uuid }
        presentation_status: { type: string, enum: [PRESENTED, NOT_PRESENTED] }
        presented_quantity: { type: number, minimum: 0 }
        conference_status: { type: [string, 'null'] }
        decision: { type: [string, 'null'], enum: [ACCEPTED, PENDING, REJECTED, null] }
        custody_objects:
          type: array
          items: { $ref: '#/components/schemas/CustodyObjectSummary' }
    CustodyObjectSummary:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        represented_quantity: { type: [number, 'null'], minimum: 0 }
        linked_sample:
          oneOf:
            - $ref: '#/components/schemas/SampleSummary'
            - type: 'null'
    UserSummary:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
    SampleSummary:
      type: object
      required: [id, accession_number]
      properties:
        id: { type: string, format: uuid }
        accession_number: { type: string }
        custody_object_id: { type: [string, 'null'], format: uuid }
        received_at: { type: [string, 'null'], format: date-time }
        received_by_id: { type: [string, 'null'], format: uuid }
        created_at: { type: [string, 'null'], format: date-time }
    CustodyHistory:
      type: object
      required: [target, items, page]
      properties:
        target:
          type: object
          required: [type, id]
          properties:
            type: { const: CUSTODY_OBJECT }
            id: { type: string, format: uuid }
        linked_sample:
          oneOf:
            - $ref: '#/components/schemas/SampleSummary'
            - type: 'null'
        items:
          type: array
          items: { $ref: '#/components/schemas/CustodyEvent' }
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: { type: [string, 'null'] }
            has_more: { type: boolean }
    CustodyEvent:
      type: object
      required: [event_id, event_type, occurred_at, recorded_at, source]
      properties:
        event_id: { type: string, format: uuid }
        event_type:
          type: string
          description: Enum provisório; catálogo final pendente de API04.
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        from_custodian: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        to_custodian: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        location_from: { type: [string, 'null'] }
        location_to: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        recorded_by: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        signature_id: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'] }
        source: { type: string, enum: [NEW_FLOW, LEGACY] }
    CustodyTransferCreate:
      type: object
      additionalProperties: false
      required: [to_custodian_id, occurred_at, reason, expected_version]
      properties:
        to_custodian_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        location_from: { type: [string, 'null'], maxLength: 255 }
        location_to: { type: [string, 'null'], maxLength: 255 }
        seal_number: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'] }
        expected_version:
          type: integer
          minimum: 0
          description: Alternativa provisória ao cabeçalho If-Match; API06 pendente.
    CustodyTransferCreated:
      type: object
      required: [event, object_version]
      properties:
        event:
          type: object
          required: [id, event_type, occurred_at, recorded_at]
          properties:
            id: { type: string, format: uuid }
            target:
              type: object
              properties:
                type: { const: CUSTODY_OBJECT }
                id: { type: string, format: uuid }
            event_type: { type: string, const: TRANSFER }
            occurred_at: { type: string, format: date-time }
            recorded_at: { type: string, format: date-time }
            from_custodian_id: { type: [string, 'null'], format: uuid }
            to_custodian_id: { type: string, format: uuid }
            location_from: { type: [string, 'null'] }
            location_to: { type: [string, 'null'] }
            reason: { type: string }
            signature_id: { type: [string, 'null'], format: uuid }
        object_version: { type: integer }
        audit_log_id: { type: [integer, 'null'] }
    AcceptanceCreate:
      type: object
      additionalProperties: false
      required: [decision, reason, expected_object_version, sample_data]
      properties:
        decision: { type: string, const: ACCEPTED }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expected_object_version: { type: integer, minimum: 0 }
        sample_data: { $ref: '#/components/schemas/SampleData' }
        coordination_validation_id: { type: [string, 'null'], format: uuid }
    SampleData:
      type: object
      description: Campos mínimos por classe ainda pendentes de API08/COMP04; serial_number não é presumido universalmente obrigatório.
      required: [lot_number, manufacturer, commercial_name, storage_location]
      properties:
        serial_number: { type: [string, 'null'], maxLength: 255 }
        lot_number: { type: string, minLength: 1, maxLength: 255 }
        manufacturer: { type: string, minLength: 1, maxLength: 255 }
        commercial_name: { type: string, minLength: 1, maxLength: 255 }
        model: { type: [string, 'null'], maxLength: 255 }
        registration_number: { type: [string, 'null'], maxLength: 255 }
        description: { type: [string, 'null'] }
        storage_location: { type: string, minLength: 1, maxLength: 255 }
        attributes:
          type: object
          additionalProperties: true
    AcceptanceCreated:
      type: object
      required: [acceptance, sample]
      properties:
        acceptance:
          type: object
          required: [id, custody_object_id, decision, decided_at]
