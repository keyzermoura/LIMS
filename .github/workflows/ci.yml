name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos e testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lims
          POSTGRES_PASSWORD: lims
          POSTGRES_DB: lims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lims -d lims_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tipagem (mypy)
        run: mypy app

      # Garante que as migrações versionadas reproduzem o schema e que o
      # metadata dos modelos não divergiu do último head.
      - name: Migrações (alembic upgrade head)
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://lims:lims@localhost:5432/lims_test

      - name: Paridade metadata x migrações (alembic check)
        run: |
          if ! alembic check; then
            echo "::error title=Alembic Check Falhou::Divergência detectada entre os modelos e migrações!"
            alembic revision --autogenerate -m "drift_diagnostic"
            DRIFT_FILE=$(ls alembic/versions/*drift_diagnostic*.py | head -n 1)
            echo "::notice title=Conteudo da Migracao de Drift::$DRIFT_FILE"
            cat "$DRIFT_FILE"
            exit 255
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://lims:lims@localhost:5432/lims_test

      - name: Upload Drift Diagnostic se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alembic-drift-diagnostic
          path: backend/alembic/versions/*drift_diagnostic*.py
          if-no-files-found: ignore

      # Primeiro SQLite (rápido, sem infraestrutura) e depois PostgreSQL real,
      # que exercita triggers, sequences nativas e advisory lock.
      - name: Testes (SQLite)
        run: pytest -q
        env:
          LIMS_TEST_DATABASE_URL: ""

      - name: Testes (PostgreSQL 16)
        run: pytest -q
        env:
          LIMS_TEST_DATABASE_URL: postgresql+asyncpg://lims:lims@localhost:5432/lims_test

  frontend:
    name: Front-end (typecheck e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker (imagens e smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Valida a interpolação e a estrutura antes de gastar tempo de build.
      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Build das imagens
        run: docker compose build

      - name: Subir a stack
        run: docker compose up -d

      - name: Semear dados de demonstração
        run: docker compose --profile tools run --rm -T seed

      # Exercita o caminho real de deploy: migrações com AUTO_CREATE_SCHEMA
      # desligado, healthcheck da API e proxy do Nginx servindo a SPA.
      - name: Smoke test (API, SPA e trilha)
        run: bash scripts/docker-smoke.sh

      - name: Logs dos serviços
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
