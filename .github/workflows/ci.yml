name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos e testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lims
          POSTGRES_PASSWORD: lims
          POSTGRES_DB: lims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lims -d lims_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tipagem (mypy)
        run: mypy app

      # Primeiro SQLite (rápido, sem infraestrutura) e depois PostgreSQL real,
      # que exercita triggers, sequences nativas e advisory lock.
      - name: Testes (SQLite)
        run: pytest -q
        env:
          LIMS_TEST_DATABASE_URL: ""

      - name: Testes (PostgreSQL 16)
        run: pytest -q
        env:
          LIMS_TEST_DATABASE_URL: postgresql+asyncpg://lims:lims@localhost:5432/lims_test

  frontend:
    name: Front-end (typecheck e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
